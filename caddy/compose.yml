services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      homelab:
        aliases:
          - files.dommcdev.net
          - office.dommcdev.net
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  homelab:
    name: homelab
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
